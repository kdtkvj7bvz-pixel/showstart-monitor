name: 秀动艺人演出上新监控

permissions:
  contents: write
  actions: write

concurrency:
  group: showstart-monitor
  cancel-in-progress: true

on:
  schedule:
    # 每 5 分钟运行一次（兜底；主驱动是工作流末尾的“自触发下一轮”）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发，用于首次测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码（含上次演出状态 showstart_state.json）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行监控脚本（抓取->对比->钉钉推送）
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
        run: python showstart_monitor.py

      - name: 把更新后的演出状态提交回仓库（保证下次去重）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showstart_state.json
          git commit -m "chore: update showstart monitor state" || echo "状态无变化，无需提交"
          git pull --rebase origin main || true
          git push

      - name: 触发下一轮检查（自驱动，约 30 秒一轮，不受 GitHub 定时延迟影响）
        # 无论前面步骤成败都触发下一轮，避免 push 失败导致监控链断裂
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kdtkvj7bvz-pixel/showstart-monitor/actions/workflows/monitor.yml/dispatches \
            -d '{"ref":"main"}' || echo "自触发失败，等待下个定时兜底"
