name: 秀动艺人演出上新监控

permissions:
  contents: write

concurrency:
  group: showstart-monitor
  cancel-in-progress: true

on:
  schedule:
    # 每 10 分钟运行一次（GitHub 的 cron 按 UTC，最短间隔 5 分钟）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发，用于首次测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码（含上次演出状态 showstart_state.json）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行监控脚本（抓取->对比->钉钉推送）
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
        run: python showstart_monitor.py

      - name: 把更新后的演出状态提交回仓库（保证下次去重）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showstart_state.json
          git commit -m "chore: update showstart monitor state" || echo "状态无变化，无需提交"
          git pull --rebase origin main || true
          git push
